name: Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Shanghai
          config_display: large
          base: header, activity, community
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_stars: yes
          config_order: base.header, languages, stars
          extras_css: |
            @media (prefers-color-scheme: dark) {
              svg { background-color: #0d1117; color: #c9d1d9; }
              text, tspan { fill: #c9d1d9 !important; }
              .field { color: #c9d1d9 !important; }
              h2, h2.field { color: #58a6ff !important; }
              rect, path, line, circle, ellipse, polygon, polyline { stroke: #30363d !important; }
            }
