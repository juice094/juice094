name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 3D 贡献日历
      - name: 3D Calendar (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/iso-calendar-light.svg
          base: ""
          config_theme: default
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
      - name: 3D Calendar (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/iso-calendar-dark.svg
          base: ""
          config_theme: github_dark
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no

      # 2. 语言统计
      - name: Languages (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/top-langs-light.svg
          base: ""
          config_theme: default
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_details: percentage, lines, bytes-size
      - name: Languages (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/top-langs-dark.svg
          base: ""
          config_theme: github_dark
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_details: percentage, lines, bytes-size

      # 3. 精选仓库（按 star 降序，取前 3）
      - name: Repositories (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/repositories-light.svg
          base: ""
          config_theme: default
          plugin_repositories: yes
          plugin_repositories_order: starred
          plugin_repositories_limit: 3
          plugin_repositories_stars: yes
      - name: Repositories (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/repositories-dark.svg
          base: ""
          config_theme: github_dark
          plugin_repositories: yes
          plugin_repositories_order: starred
          plugin_repositories_limit: 3
          plugin_repositories_stars: yes

      # 4. 最近标星的仓库（限制 3 个）
      - name: Stars (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/stars-light.svg
          base: ""
          config_theme: default
          plugin_stars: yes
          plugin_stars_limit: 3
      - name: Stars (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/stars-dark.svg
          base: ""
          config_theme: github_dark
          plugin_stars: yes
          plugin_stars_limit: 3

      # 5. 用户反应 / 24 小时提交分布
      - name: Reactions & Habits (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/habits-light.svg
          base: ""
          config_theme: default
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: donut
      - name: Reactions & Habits (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/habits-dark.svg
          base: ""
          config_theme: github_dark
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: donut

      # 统一提交
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push