name: Aggregate account stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/aggregate_stats.py

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.json
          git commit -m "chore: update aggregated account stats" || exit 0
          git push
